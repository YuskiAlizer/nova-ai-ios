name: Build iOS .ipa

on:
  workflow_dispatch:
    inputs:
      signing_type:
        description: 'Type de signature'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    branches: [ main ]
    paths:
      - 'nova-ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create provisioning profile directory
        run: mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Decode signing certificate (if provided)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          echo "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Decode provisioning profile (if provided)
        if: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build archive
        run: |
          cd nova-ios
          xcodebuild archive \
            -project NovaAI.xcodeproj \
            -scheme NovaAI \
            -archivePath ../build/NovaAI.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE="${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'Manual' || 'Automatic' }}" \
            CODE_SIGN_IDENTITY="${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'Apple Development' || '' }}" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            || echo "Build failed - see logs above"

      - name: Export .ipa
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          cd nova-ios
          # Update ExportOptions.plist with selected signing type
          sed -i '' "s/development/${{ github.event.inputs.signing_type || 'development' }}/g" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath ../build/NovaAI.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ../build/ipa/

      - name: Upload .ipa artifact
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI.ipa
          path: build/ipa/*.ipa

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.log
